name: reliable-notifier

services:
  postgres:
    image: postgres:18.2-alpine@sha256:035b9ab53cfa147d7202b61f5f7782b939ae815b7d6bc81c96b7b42ff1fca950
    environment:
      POSTGRES_DB: notifier
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier-test-only
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(head -1 "$$PGDATA/postmaster.pid" 2>/dev/null)" = "1" &&
          pg_isready -U notifier -d notifier
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine@sha256:adac51a4a14a200b8eb928a12787564ed56e93fc55e789a73ec13e1e2eac7aef
    environment:
      RABBITMQ_DEFAULT_USER: notifier
      RABBITMQ_DEFAULT_PASS: notifier-test-only
    ports:
      - "${RABBITMQ_PORT:-15672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-25672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command:
      - -path
      - /migrations
      - -database
      - postgres://notifier:notifier-test-only@postgres:5432/notifier?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  fake-supplier:
    build:
      context: .
      args:
        PACKAGE: ./cmd/fake-supplier
    environment:
      TLS_CERT_FILE: /certs/fake-supplier.crt
      TLS_KEY_FILE: /certs/fake-supplier.key
    volumes:
      - ./testdata/certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://localhost:8443/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      supplier-test:
        aliases:
          - fake-supplier.test

  safe-dial-probe:
    profiles: ["tools"]
    build:
      context: .
      args:
        PACKAGE: ./cmd/toolchain-probe
    command: ["http-tls"]
    environment:
      FAKE_SUPPLIER_URL: https://fake-supplier.test:8443/healthz
      FAKE_SUPPLIER_CA_FILE: /certs/test-ca.crt
    volumes:
      - ./testdata/certs/test-ca.crt:/certs/test-ca.crt:ro
    networks:
      - supplier-test

  app:
    build:
      context: .
      args:
        PACKAGE: ./cmd/notifier
        TAGS: testnetwork
    ports:
      - "${APP_PORT:-18080}:8080"
    environment:
      APP_ENV: test
      DATABASE_URL: postgres://notifier:notifier-test-only@postgres:5432/notifier?sslmode=disable
      RABBITMQ_URL: amqp://notifier:notifier-test-only@rabbitmq:5672/
      PUBLISHER_ENABLED: "${PUBLISHER_ENABLED:-true}"
      WORKER_ENABLED: "${WORKER_ENABLED:-true}"
      WORKER_ID: worker-1
      BACKLOG_LIMIT: "${BACKLOG_LIMIT:-100000}"
      BOOTSTRAP_LOCAL_CONFIG: "true"
      BOOTSTRAP_CALLER_ID: caller-a
      BOOTSTRAP_CALLER_API_KEY: caller-a-test-key
      BOOTSTRAP_DESTINATION_ID: supplier-a
      BOOTSTRAP_DESTINATION_URL: https://fake-supplier.test:8443/notify
      SUPPLIER_AUTH_VALUE: Bearer fake-supplier-test-token
      ALLOW_TEST_NETWORK_POLICY: "true"
      TEST_SUPPLIER_CA_FILE: /certs/test-ca.crt
    volumes:
      - ./testdata/certs/test-ca.crt:/certs/test-ca.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - backend
      - supplier-test

networks:
  backend:
  supplier-test:
    internal: true
    labels:
      reliable-notifier.policy: test-only

volumes:
  postgres-data:
  rabbitmq-data:
